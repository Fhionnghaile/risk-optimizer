[project]
name = "risk-optimizer"
version = "1.0.0"
description = "FAIR-based security-investment optimisation: the efficient frontier of spend vs residual risk."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
